<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="生存日志玩家图鉴：看食材属性和标签，按品质比较菜肴效果，查找食材能做的料理。">
    <title>生存日志 · 幸存者图鉴</title>
    <!-- SEO_HEAD -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#nameSearch">跳到搜索</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="生存日志图鉴首页">
          <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 11h18l-2 13H9zM5 11h22M12 7c-3-3 3-3 0-6m8 6c-3-3 3-3 0-6M12 28h8"/></svg></span>
          <span class="brand-text">SURVIVAL LOG<strong>幸存者图鉴</strong></span>
        </a>
        <div class="sidebar-caption">生存，从吃好一餐开始。</div>
        <nav id="categoryNav" class="category-nav" aria-label="图鉴分类"></nav>
        <div class="sidebar-note"><span class="note-marker">小提示</span><p>标签决定搭配，品质影响效果。<br>先查食材，再选一道值得做的菜。</p></div>
        <div class="sidebar-bottom">
          <span class="edition-label"><span class="status-dot"></span>在线图鉴</span>
          <div id="gameVersion" class="game-version">读取数据版本…</div>
          <a href="https://github.com/tianwaiyan/SurvivalLogDataViewer" target="_blank" rel="noopener noreferrer">原项目 <span aria-hidden="true">↗</span></a>
          <a href="https://github.com/shadowwinds/SurvivalLogDataViewer" target="_blank" rel="noopener noreferrer">网页源码 <span aria-hidden="true">↗</span></a>
          <a href="./guide/">完整图鉴目录 <span aria-hidden="true">→</span></a>
        </div>
      </aside>
      <main class="main-content">
        <header class="page-header">
          <div><div class="eyebrow">THE SURVIVOR'S HANDBOOK</div><h1 id="categoryTitle">食材与食品</h1><p id="categoryIntro">看属性、查标签，找到食材的好去处。</p></div>
          <div class="header-emblem" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M14 29h36a18 18 0 0 1-36 0zM9 29h46M25 52h14M24 18c-6-6 5-7 0-13m16 13c-6-6 5-7 0-13"/></svg><span>吃好 · 活下去</span></div>
        </header>
        <form id="searchForm" class="search-toolbar" role="search">
          <label class="search-field"><span id="searchLabel">找食材</span><div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="nameSearch" type="search" placeholder="搜索名称、标签或效果说明" autocomplete="off" disabled><kbd aria-hidden="true">/</kbd></div></label>
          <label class="search-field" id="materialField" hidden><span>我想用这些材料</span><div class="input-wrap"><input id="materialSearch" type="search" placeholder="例如：松茸、鸡蛋" autocomplete="off" disabled></div></label>
          <label class="select-field" id="qualityField" hidden><span>成品品质</span><select id="qualitySelect"><option value="普通">普通</option><option value="良好">良好</option><option value="完美">完美</option><option value="失败">失败</option></select></label>
          <button class="reset-button" id="resetSearch" type="button" disabled>重置</button>
        </form>
        <div id="playerFilters" class="player-filters">
          <label id="tagField" class="filter-select"><span>食品标签</span><select id="tagSelect" aria-label="食品标签"><option value="">全部标签</option></select></label>
          <div id="effectFilters" class="effect-filters" role="group" aria-label="按属性增益筛选"></div>
          <label id="cookableField" class="check-filter"><input id="cookableOnly" type="checkbox">只看可烹饪</label>
        </div>
        <div class="results-toolbar"><div><strong id="resultCount" role="status">正在读取图鉴…</strong><span id="filterSummary"></span></div><label>排序<select id="sortSelect" aria-label="条目排序"><option value="default">图鉴顺序</option></select></label></div>
        <div class="workspace">
          <section class="entries-panel" aria-label="条目列表">
            <div id="entryList" class="entry-list" aria-busy="true"><div class="loading-state">正在整理生存手册…</div></div>
            <div id="emptyState" class="empty-state" hidden><span aria-hidden="true">⌕</span><h2>这次没有找到</h2><p>换个关键词，或减少标签和属性筛选。</p><button type="button" id="emptyReset">清除筛选</button></div>
          </section>
          <dialog id="detailPanel" class="detail-panel" open aria-label="图鉴详情">
            <div class="detail-toolbar"><span id="detailPosition">食材笔记</span><button id="closeDetail" class="close-detail" type="button" aria-label="返回列表">返回列表 <span aria-hidden="true">×</span></button></div>
            <div id="detailContent" class="detail-content"><div class="detail-placeholder"><p>选择食材，查看属性和用途。</p></div></div>
          </dialog>
        </div>
        <div id="loadError" class="load-error" role="alert" hidden><h2>图鉴暂时未能加载</h2><p id="errorMessage"></p><button id="retryLoad" type="button">重新加载</button></div>
        <footer class="page-footer"><span id="footerVersion">Survival Log · 生存日志</span><span>存档与库存匹配请使用<a href="https://github.com/tianwaiyan/SurvivalLogDataViewer" target="_blank" rel="noopener noreferrer">本地版 ↗</a></span></footer>
      </main>
    </div>
    <noscript><style>body { overflow: auto; } .app-shell { display: none; } .directory-links { display: flex; flex-wrap: wrap; gap: 20px; }</style><div class="noscript"><h1>生存日志 · 幸存者图鉴</h1><p>无需 JavaScript 也可以浏览每个食材的属性、标签和各品质菜肴效果。</p><!-- SEO_DIRECTORY --></div></noscript>
  </body>
</html>
