<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Survival Log 生存图鉴</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="图鉴导航">
        <div class="brand">
          <div class="brand-mark">SL</div>
          <div>
            <div class="brand-kicker">OFFLINE CODEX</div>
            <h1>生存图鉴</h1>
          </div>
        </div>

        <section class="overall-block" aria-labelledby="overall-title">
          <div class="section-label" id="overall-title">总体进度</div>
          <div class="overall-number" id="overallNumber">--/--</div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-value" id="overallProgress"></div>
          </div>
          <div class="overall-rate" id="overallRate">正在读取</div>
        </section>

        <nav class="category-nav" id="categoryNav" aria-label="图鉴分类"></nav>

        <section class="source-block">
          <div class="section-label source-label">数据源</div>
          <div class="source-version" id="gameVersion">
            <span class="source-version-label">游戏版本</span>
            <span class="source-version-value">--</span>
          </div>
          <div class="source-status" id="syncStatus" data-status="loading">
            <span class="status-dot" aria-hidden="true"></span>
            <span>正在连接本地服务</span>
          </div>
          <div class="source-path" id="savePath" title="存档路径">存档路径读取中</div>
        </section>
      </aside>

      <main class="main-content">
        <section class="toolbar" aria-label="条目筛选">
          <div class="search-fields">
            <div class="search-field-group">
              <label class="search-label" for="nameSearchInput">成品名称</label>
              <div class="search-box search-field">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="nameSearchInput" type="search" placeholder="名称、名称键或 ID" autocomplete="off">
              </div>
            </div>
            <div class="search-field-group material-search-field">
              <label class="search-label" for="materialSearchInput">材料</label>
              <div class="search-box search-field">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="materialSearchInput" type="search" placeholder="材料名称或 ID" autocomplete="off">
              </div>
            </div>
          </div>
          <button type="button" class="clear-filter-button" id="clearTextFilters" title="清除名称和材料筛选">取消筛选</button>
          <div class="filter-group" id="filterGroup" role="group" aria-label="完成状态">
            <button type="button" class="filter-button active" data-filter="all">全部</button>
            <button type="button" class="filter-button" data-filter="completed">已解锁</button>
            <button type="button" class="filter-button" data-filter="pending">未解锁</button>
          </div>
        </section>

        <div class="workspace-grid">
          <section class="entries-panel" aria-labelledby="entriesTitle">
            <div class="panel-heading">
              <div>
                <div class="panel-kicker">ENTRIES</div>
                <h3 id="entriesTitle">条目列表</h3>
              </div>
              <div class="result-count" id="resultCount">-- 条</div>
            </div>
            <div class="entry-list" id="entryList" aria-live="polite">
              <div class="loading-state">正在读取图鉴条目</div>
            </div>
          </section>

          <aside class="detail-panel" aria-labelledby="detailTitle">
            <div class="panel-heading">
              <div>
                <div class="panel-kicker">DETAIL</div>
                <h3 id="detailTitle">条目详情</h3>
              </div>
            </div>
            <div class="detail-content" id="detailContent">
              <div class="empty-state">选择一个条目查看详情</div>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
